<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="blog.meta.title">Blog — Jakub Křepelka</title>
<meta name="description" data-i18n-content="blog.meta.desc" content="Zápisky o tom, jak weby vznikají — co funguje, co ne a proč." />
<meta name="theme-color" content="#050505" />

<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400..600&family=Spline+Sans+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body class="page">

<div class="grain" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a class="nav__mark" href="/#hero" data-link>JK<i></i></a>

  <nav class="nav__links" data-i18n-label="nav.menu" aria-label="Menu">
    <a href="/" data-i18n="nav.home">Domů</a>
    <a href="/zamereni/" data-i18n="nav.focus">Zaměření</a>
    <a href="/reference/" data-i18n="nav.refs">Reference</a>
    <a href="/blog/" data-i18n="nav.blog">Blog</a>
    <a href="/faq/" data-i18n="nav.faq">FAQ</a>
    <div class="lang" role="group" data-i18n-label="nav.lang" aria-label="Volba jazyka">
      <button class="lang__btn" type="button" data-lang="cs" data-i18n-label="nav.lang.cs" aria-label="Přepnout do češtiny">CS</button>
      <span class="lang__sep" aria-hidden="true">/</span>
      <button class="lang__btn" type="button" data-lang="en" data-i18n-label="nav.lang.en" aria-label="Switch to English">EN</button>
    </div>
  </nav>

  <a class="btn btn--sm btn--primary nav__cta" href="mailto:jk.krepjak@gmail.com?subject=Popt%C3%A1vka%20webu" data-contact>
    <span data-i18n="nav.cta">Nezávazná poptávka</span>
  </a>

  <button class="nav__burger" type="button" data-menu aria-expanded="false"
          data-i18n-label="nav.menu.open" aria-label="Otevřít menu">
    <span></span><span></span>
  </button>
</header>

<main class="page__main">

  <header class="page__head">
    <span class="eyebrow" data-i18n="blog.eyebrow">Zápisky</span>
    <h1 class="page__title" data-i18n="blog.title">Blog</h1>
    <p class="page__lead" data-i18n="blog.lead">Jak weby vznikají.</p>
  </header>

  <!-- ── posts ────────────────────────────────────────────────────
       A post is one <li> in this list; drop the empty state once the
       first one lands:

       <li class="post" data-reveal>
         <a class="post__link" href="/blog/nazev-clanku/">
           <time class="post__date" datetime="2026-09-01">1. 9. 2026</time>
           <h2 class="post__title">Nadpis článku</h2>
           <p class="post__lead">Dvě věty o tom, o čem to je.</p>
         </a>
       </li>
       ───────────────────────────────────────────────────────────── -->
  <ol class="posts">
    <li class="post post--empty" data-reveal>
      <span class="post__mark" aria-hidden="true">—</span>
      <div>
        <h2 class="post__title" data-i18n="blog.empty.title">První článek se píše</h2>
        <p class="post__lead" data-i18n="blog.empty.text">Zatím tu nic není.</p>
      </div>
    </li>
  </ol>

  <section class="page__cta">
    <h2 class="page__cta-title" data-i18n="blog.cta.title">—</h2>
    <p class="page__cta-text" data-i18n="blog.cta.text">—</p>
    <div class="finale__ctas">
      <a class="btn btn--primary" data-contact data-i18n-href="finale.mail" href="mailto:jk.krepjak@gmail.com?subject=Popt%C3%A1vka%20webu">
        <span data-i18n="finale.cta1">Pojďme do toho</span><i aria-hidden="true">→</i>
      </a>
      <a class="btn btn--ghost" href="/zamereni/"><span data-i18n="nav.focus">—</span></a>
    </div>
  </section>

  <footer class="footer page__footer">
    <div class="footer__links">
      <a href="https://instagram.com/kubakrepelka" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="mailto:jk.krepjak@gmail.com" data-i18n="footer.email">E-mail</a>
      <button type="button" class="footer__btn" data-cookie-open data-i18n="footer.cookies">Cookies</button>
    </div>
    <div class="footer__meta">
      <span>© <i id="year">2026</i> Jakub Křepelka</span>
      <span class="footer__built" data-i18n="footer.built">Postaveno scrollem, ne slidy.</span>
    </div>
  </footer>

</main>

<script type="module" src="/src/page.js"></script>
</body>
</html>
